<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:0" />
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg-gradient)"/>

  <!-- Glow effect at top -->
  <ellipse cx="512" cy="200" rx="400" ry="150" fill="url(#glow)" opacity="0.4"/>

  <!-- Main logo container -->
  <g transform="translate(512, 512)" filter="url(#shadow)">

    <!-- Modern game controller shape -->
    <!-- Controller main body -->
    <path d="M -220 -60
             Q -260 -60 -280 -40
             L -315 30
             Q -330 60 -315 90
             L -295 125
             Q -285 140 -260 140
             L -190 140
             Q -175 140 -170 125
             L -130 35
             Q -125 20 -110 20
             L 110 20
             Q 125 20 130 35
             L 170 125
             Q 175 140 190 140
             L 260 140
             Q 285 140 295 125
             L 315 90
             Q 330 60 315 30
             L 280 -40
             Q 260 -60 220 -60
             L 110 -60
             Q 90 -60 90 -75
             Q 90 -90 75 -95
             L -75 -95
             Q -90 -90 -90 -75
             Q -90 -60 -110 -60
             Z"
          fill="#FFFFFF" opacity="0.98"/>

    <!-- Inner detail -->
    <path d="M -210 -50
             Q -240 -50 -255 -35
             L -285 25
             Q -295 48 -285 70
             L -270 100
             Q -263 110 -245 110
             L -190 110
             Q -180 110 -177 100
             L -145 30
             Q -142 22 -130 22
             L 130 22
             Q 142 22 145 30
             L 177 100
             Q 180 110 190 110
             L 245 110
             Q 263 110 270 100
             L 285 70
             Q 295 48 285 25
             L 255 -35
             Q 240 -50 210 -50
             L 120 -50
             Q 105 -50 105 -62
             Q 105 -72 95 -75
             L -95 -75
             Q -105 -72 -105 -62
             Q -105 -50 -120 -50
             Z"
          fill="#F3F4F6" opacity="0.6"/>

    <!-- D-pad (left side) - modern style -->
    <g>
      <!-- Vertical -->
      <rect x="-205" y="-5" width="30" height="70" rx="5" fill="#2563EB"/>
      <rect x="-202" y="-2" width="24" height="64" rx="4" fill="#3B82F6"/>
      <!-- Horizontal -->
      <rect x="-225" y="15" width="70" height="30" rx="5" fill="#2563EB"/>
      <rect x="-222" y="18" width="64" height="24" rx="4" fill="#3B82F6"/>
      <!-- Center circle -->
      <circle cx="-190" cy="30" r="8" fill="#1E40AF"/>
    </g>

    <!-- Action buttons (right side) - ABXY layout -->
    <g>
      <!-- Y - Top -->
      <circle cx="165" cy="-5" r="20" fill="#2563EB"/>
      <circle cx="165" cy="-5" r="16" fill="#3B82F6"/>

      <!-- B - Right -->
      <circle cx="205" cy="30" r="20" fill="#2563EB"/>
      <circle cx="205" cy="30" r="16" fill="#3B82F6"/>

      <!-- A - Bottom -->
      <circle cx="165" cy="65" r="20" fill="#2563EB"/>
      <circle cx="165" cy="65" r="16" fill="#3B82F6"/>

      <!-- X - Left -->
      <circle cx="125" cy="30" r="20" fill="#2563EB"/>
      <circle cx="125" cy="30" r="16" fill="#3B82F6"/>
    </g>

    <!-- Analog sticks - modern 3D effect -->
    <g>
      <!-- Left stick -->
      <circle cx="-70" cy="65" r="30" fill="#E5E7EB"/>
      <circle cx="-70" cy="65" r="26" fill="#F3F4F6"/>
      <circle cx="-70" cy="65" r="18" fill="#2563EB"/>
      <circle cx="-70" cy="65" r="14" fill="#3B82F6"/>

      <!-- Right stick -->
      <circle cx="70" cy="-35" r="30" fill="#E5E7EB"/>
      <circle cx="70" cy="-35" r="26" fill="#F3F4F6"/>
      <circle cx="70" cy="-35" r="18" fill="#2563EB"/>
      <circle cx="70" cy="-35" r="14" fill="#3B82F6"/>
    </g>

    <!-- Decorative details - triggers -->
    <rect x="-250" y="-90" width="70" height="20" rx="10" fill="#FFFFFF" opacity="0.4"/>
    <rect x="180" y="-90" width="70" height="20" rx="10" fill="#FFFFFF" opacity="0.4"/>

    <!-- LED indicators -->
    <circle cx="-30" cy="-85" r="4" fill="#60A5FA" opacity="0.8"/>
    <circle cx="0" cy="-85" r="4" fill="#60A5FA" opacity="0.6"/>
    <circle cx="30" cy="-85" r="4" fill="#60A5FA" opacity="0.4"/>

  </g>

  <!-- Modern text treatment -->
  <g>
    <text x="512" y="820"
          font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif"
          font-size="72"
          font-weight="800"
          fill="#FFFFFF"
          text-anchor="middle"
          letter-spacing="2">GAME</text>
    <text x="512" y="900"
          font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif"
          font-size="56"
          font-weight="700"
          fill="#FFFFFF"
          text-anchor="middle"
          letter-spacing="8"
          opacity="0.95">DISCOVERY</text>
  </g>

  <!-- Subtle sparkle effects -->
  <circle cx="220" cy="220" r="4" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="800" cy="300" r="3" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="180" cy="780" r="3" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="850" cy="720" r="4" fill="#FFFFFF" opacity="0.5"/>
</svg>
